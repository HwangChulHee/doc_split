[project]
name = "docsplit"
version = "0.1.0"
description = "Loan document package splitter — page classification and grouping pipeline"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsplit"]
