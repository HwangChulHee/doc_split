[project]
name = "docsplit"
version = "0.1.0"
description = "Page classification and document grouping for merged mortgage loan document packages"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.1.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsplit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
