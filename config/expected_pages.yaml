# 정답(GT)이 없는 패키지의 기대 페이지 — 검증 V1/V2/V3의 입력.
#
# 첫 번째 패키지는 원본 문서가 있어 GT를 기계 생성하므로 여기 적지 않는다.
# 두 번째 패키지는 정답이 없어 **관찰 결과**를 기대값으로 쓴다
# (근거: outputs/observation_report.md, docs/analysis/*).
#
# 페이지 번호는 0-based, 키는 패키지 라벨(파일명 앞 NN.)이다.
# 라벨이 실제 데이터와 맞지 않으면 파이프라인이 경고를 출력한다 —
# 조용히 빈 목록이 되어 V2/V3가 대량 오판정되는 것을 막기 위함.

URLA_1003:
  "02":
    expected: [12, 15, 17, 19, 22, 24, 28, 34, 36, 42]

CREDIT_REPORT:
  "02":
    # 본 리포트 10p + 점수 고지 2p + 소비자 편지 2p
    expected: [1, 3, 5, 7, 9, 13, 18, 20, 23, 27, 33, 37, 40, 43]
    # 유형 귀속 미결 — 검증의 기대값에도 반례에도 넣지 않는다.
    # p31은 고용 이력 조회 결과 표시 페이지다. 제품 동정은 UNCERTAIN이며
    # (분석 income_standard_analysis.md §6-2: 제품명 부재, 발행 CRA가 다른 회사)
    # INCOME 정책 도입 후에도 이 페이지는 CREDIT/INCOME 사이에서 갈린다 —
    # INCOME 기대 목록에는 defer_llm 경로로 올라가 있고, 최종 판정은 LLM이 한다.
    undecided: [31]

INCOME_DOC:
  # I-V1은 다른 유형의 V1과 다르다: "전부 RULE_HIGH"가 아니라 **페이지마다 의도된
  # 경로가 다르다** (docs/classification/income_doc.md §5). P&L·검증 대행 리포트가
  # LLM으로 가는 것은 실패가 아니라 명세다. 그래서 단일 리스트가 아니라 경로별로 적는다.
  "01":
    expected_paths:
      # 차주가 직접 작성한 손익 명세 — 어휘 프로브 32종 중 0건 (분석 §8-1).
      # 규칙이 잡지 못하는 것이 이 하위군의 본질이다.
      no_signal: [35]
  "02":
    expected_paths:
      rule_high: [11, 26]      # transcript 제목 보유 (I-D2)
      rule_medium: [30]        # 제목 없는 2쪽 — 고지문 + 세무 특이어
      defer_llm: [38, 31]      # 껍데기 1장, 고용검증 1장
      no_signal: [35]          # 검증 대행 리포트 — 준거 미확보로 규칙 미채택 (설계 §2-3)

TITLE_REPORT:
  "02":
    # ALTA Commitment Schedule 5장 × 2벌 (분석 §6-1의 쌍 대응)
    expected: [0, 2, 4, 6, 8, 14, 16, 21, 32, 41]
    # 텍스트 0자 스캔본 — 규칙 검증(T-V1)이 아니라 VLM 검증(T-V6)의 대상이다.
    # 규칙으로 잡힐 수 없는 페이지를 규칙 검증에 섞으면 실패의 의미가 흐려진다.
    expected_vlm: [10, 25, 39]
